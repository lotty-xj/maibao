<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="麦宝日记">
<meta name="theme-color" content="#FF6B8A">
<meta name="description" content="记录宝宝每一个成长的瞬间">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>麦宝的成长日记</title>
<style>
/* ========== Color Block Design System ========== */
:root {
  --pink: #FF6B8A; --pink-light: #FFF0F3; --pink-dark: #E55A75;
  --orange: #FF8C42; --orange-light: #FFF3EB; --orange-dark: #E67A35;
  --yellow: #FFD23F; --yellow-light: #FFFBE6; --yellow-dark: #E6BD2A;
  --green: #3ECF8E; --green-light: #EDFBF5; --green-dark: #2FB878;
  --blue: #5B9BD5; --blue-light: #EEF5FC; --blue-dark: #4A89C0;
  --purple: #9B7ED8; --purple-light: #F5F2FC; --purple-dark: #886AC5;
  --coral: #FF6F61; --coral-light: #FFF0EE;
  --teal: #26C6B7; --teal-light: #E8FAF8;

  --bg: #F7F4F0;
  --bg-card: #FFFFFF;
  --bg-sidebar: #FFFAF5;
  --text: #2D3436;
  --text-light: #636E72;
  --text-muted: #B2BEC3;
  --border: rgba(0,0,0,0.06);
  --shadow: 0 2px 16px rgba(0,0,0,0.05);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
  --radius: 20px;
  --radius-sm: 12px;
  --sidebar-width: 220px;
  --header-height: 64px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;overflow:hidden;height:100vh;
}
.app{display:flex;height:100vh}

/* ========== Sidebar ========== */
.sidebar{
  width:var(--sidebar-width);min-width:var(--sidebar-width);
  background:#fff;border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:10;
  transition:transform 0.3s;
}
.sidebar-header{
  padding:18px 16px;text-align:center;
  background:linear-gradient(135deg, #FFF0F3 0%, #FFF3EB 50%, #FFFBE6 100%);
  border-bottom:2px solid rgba(255,107,138,0.15);
}
.sidebar-header .logo{font-size:20px;font-weight:800;color:var(--pink-dark);letter-spacing:1px}
.sidebar-header .subtitle{font-size:11px;color:var(--text-light);margin-top:2px}
.sidebar-header .baby-info{font-size:12px;color:var(--orange);margin-top:6px;font-weight:700}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 8px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;margin:2px 0;
  cursor:pointer;font-size:13px;color:var(--text);font-weight:600;
  border-radius:12px;transition:all 0.2s;position:relative;
}
.nav-item:hover{background:var(--pink-light)}
.nav-item.active{
  color:#fff;
  background:linear-gradient(135deg, var(--pink), var(--pink-dark));
  box-shadow:0 4px 12px rgba(255,107,138,0.3);
}
.nav-item .nav-icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.nav-item .badge{
  margin-left:auto;background:rgba(255,255,255,0.3);color:#fff;
  font-size:10px;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center;
}
.nav-item:not(.active) .badge{background:var(--pink);color:#fff}
.sidebar-footer{
  padding:12px 16px;border-top:1px solid var(--border);
  font-size:11px;color:var(--text-muted);text-align:center;
}
.sync-indicator{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px;font-size:11px;color:var(--green-dark);font-weight:600;
}
.sync-indicator .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync-indicator.offline{color:var(--text-muted)}
.sync-indicator.offline .dot{background:var(--text-muted)}

/* ========== Main Content ========== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{
  height:var(--header-height);min-height:var(--header-height);
  background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 24px;gap:16px;
}
.main-header .page-title{font-size:18px;font-weight:800;color:var(--text)}
.main-header .family-switch{display:flex;align-items:center;gap:4px}
.hdr-avatar{
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;transition:all 0.2s;
  border:2px solid transparent;flex-shrink:0;
}
.hdr-avatar:hover{transform:scale(1.1)}
.hdr-avatar.active{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink-light);transform:scale(1.15)}
.hdr-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.member-popup{
  position:absolute;top:48px;right:0;background:#fff;
  border-radius:var(--radius-sm);box-shadow:0 8px 32px rgba(0,0,0,0.15);
  padding:8px;z-index:30;min-width:160px;display:none;
}
.member-popup.show{display:block}
.member-popup .mp-item{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
  transition:background 0.15s;
}
.member-popup .mp-item:hover{background:var(--pink-light)}
.member-popup .mp-item.active{background:var(--pink-light);color:var(--pink-dark)}
.member-popup .mp-avatar{
  width:32px;height:32px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;
}
.member-popup .mp-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.main-header .current-date{
  font-size:12px;color:var(--text-light);background:var(--yellow-light);
  padding:4px 12px;border-radius:20px;font-weight:600;
}
.main-content{flex:1;overflow-y:auto;padding:20px 24px}
.main-content::-webkit-scrollbar{width:6px}
.main-content::-webkit-scrollbar-thumb{background:var(--pink-light);border-radius:3px}

/* ========== Section ========== */
.section{display:none}
.section.active{display:block}

/* ========== Color Cards ========== */
.card{
  border-radius:var(--radius);padding:20px;margin-bottom:16px;
  box-shadow:var(--shadow);transition:all 0.3s;
}
.card-white{background:#fff}
.card-pink{background:linear-gradient(135deg, #FFF0F3 0%, #FFE8EC 100%);border:1px solid rgba(255,107,138,0.15)}
.card-orange{background:linear-gradient(135deg, #FFF3EB 0%, #FFEBE0 100%);border:1px solid rgba(255,140,66,0.15)}
.card-yellow{background:linear-gradient(135deg, #FFFBE6 0%, #FFF8D6 100%);border:1px solid rgba(255,210,63,0.2)}
.card-green{background:linear-gradient(135deg, #EDFBF5 0%, #E0F7EE 100%);border:1px solid rgba(62,207,142,0.15)}
.card-blue{background:linear-gradient(135deg, #EEF5FC 0%, #E3EEF9 100%);border:1px solid rgba(91,155,213,0.15)}
.card-purple{background:linear-gradient(135deg, #F5F2FC 0%, #EDE7F9 100%);border:1px solid rgba(155,126,216,0.15)}
.card:hover{box-shadow:var(--shadow-lg)}

.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid rgba(0,0,0,0.05);
}
.card-title{font-size:15px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:20px}

/* ========== Stat Blocks ========== */
.stat-blocks{display:flex;gap:12px;flex-wrap:wrap}
.stat-block{
  flex:1;min-width:120px;border-radius:var(--radius-sm);padding:18px 16px;
  text-align:center;color:#fff;cursor:pointer;transition:all 0.2s;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
}
.stat-block:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.12)}
.stat-block .sb-value{font-size:32px;font-weight:800;line-height:1}
.stat-block .sb-label{font-size:12px;opacity:0.9;margin-top:6px;font-weight:600}
.stat-block.pink{background:linear-gradient(135deg, #FF6B8A, #FF8FA3)}
.stat-block.orange{background:linear-gradient(135deg, #FF8C42, #FFA868)}
.stat-block.yellow{background:linear-gradient(135deg, #FFC107, #FFD54F);color:#7A5D00}
.stat-block.green{background:linear-gradient(135deg, #3ECF8E, #5DDAA0)}
.stat-block.blue{background:linear-gradient(135deg, #5B9BD5, #7DB5E3)}
.stat-block.purple{background:linear-gradient(135deg, #9B7ED8, #B39EE6)}
.stat-block.coral{background:linear-gradient(135deg, #FF6F61, #FF8E82)}
.stat-block.teal{background:linear-gradient(135deg, #26C6B7, #4DD4C7)}

/* ========== Grid ========== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ========== Buttons ========== */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 18px;
  border:none;border-radius:10px;font-size:13px;font-weight:700;
  cursor:pointer;transition:all 0.2s;font-family:inherit;white-space:nowrap;
}
.btn-primary{background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(255,107,138,0.25)}
.btn-primary:hover{background:var(--pink-dark);transform:translateY(-1px)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-xs{padding:4px 9px;font-size:11px;border-radius:6px}
.btn-outline{background:#fff;color:var(--pink);border:2px solid var(--pink);font-weight:600}
.btn-outline:hover{background:var(--pink-light)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-dark)}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:transparent;color:var(--text-light)}
.btn-ghost:hover{background:rgba(0,0,0,0.04)}

/* ========== Activity Feed ========== */
.activity-feed{
  max-height:200px;overflow-y:auto;padding-right:8px;
}
.activity-feed::-webkit-scrollbar{width:4px}
.activity-feed::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}
.activity-item{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(0,0,0,0.04);font-size:12px;
}
.activity-item:last-child{border-bottom:none}
.activity-item .ai-user{
  padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;
}
.activity-item .ai-detail{flex:1;color:var(--text);min-width:0}
.activity-item .ai-time{color:var(--text-muted);font-size:11px;white-space:nowrap}
.ai-pink{background:var(--pink-light);color:var(--pink-dark)}
.ai-orange{background:var(--orange-light);color:var(--orange-dark)}
.ai-blue{background:var(--blue-light);color:var(--blue-dark)}
.ai-green{background:var(--green-light);color:var(--green-dark)}
.ai-purple{background:var(--purple-light);color:var(--purple-dark)}

/* ========== Knowledge Cards ========== */
.knowledge-block{
  background:linear-gradient(135deg, #FFF0F3 0%, #FFF3EB 50%, #FFFBE6 100%);
  border-radius:var(--radius);padding:24px;margin-bottom:12px;
  border:2px solid rgba(255,107,138,0.15);position:relative;overflow:hidden;
}
.knowledge-block::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:80px;height:80px;border-radius:50%;
  background:rgba(255,107,138,0.06);
}
.knowledge-block h3{font-size:16px;font-weight:800;color:var(--pink-dark);margin-bottom:10px}
.knowledge-block p{font-size:14px;color:var(--text);line-height:1.8;position:relative;z-index:1}
.knowledge-block .source{font-size:11px;color:var(--text-muted);margin-top:8px}
.myth-block{
  background:linear-gradient(135deg, #FFF3EB, #FFF5E6);
  border:2px solid rgba(255,140,66,0.12);border-radius:var(--radius-sm);
  padding:14px 16px;margin-bottom:8px;
}
.myth-block .wrong{font-size:12px;color:var(--orange);text-decoration:line-through;margin-bottom:4px}
.myth-block .right{font-size:13px;color:var(--text);font-weight:700}

/* ========== Supplement Reminder ========== */
.supp-reminder{
  display:flex;align-items:center;gap:14px;padding:16px 20px;
  background:linear-gradient(135deg, #F5F2FC 0%, #EDE4FA 100%);
  border:2px solid rgba(155,126,216,0.2);border-radius:var(--radius);
  margin-bottom:16px;
}
.supp-reminder .sr-icon{font-size:32px}
.supp-reminder .sr-text{flex:1}
.supp-reminder .sr-title{font-size:15px;font-weight:800;color:var(--purple-dark)}
.supp-reminder .sr-detail{font-size:12px;color:var(--text-light)}

/* ========== Tabs ========== */
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{
  padding:9px 18px;cursor:pointer;font-size:13px;font-weight:700;
  border-radius:10px;background:#fff;color:var(--text-light);
  border:2px solid transparent;transition:all 0.2s;
}
.tab:hover{background:var(--pink-light);color:var(--pink-dark)}
.tab.active{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 4px 12px rgba(255,107,138,0.2)}

/* ========== Timeline ========== */
.tl-item{display:flex;gap:14px;padding:14px 0;position:relative}
.tl-item::before{
  content:'';position:absolute;left:16px;top:38px;bottom:0;
  width:2px;background:rgba(0,0,0,0.06);
}
.tl-item:last-child::before{display:none}
.tl-dot{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;z-index:1;font-weight:700;
}
.tl-dot.done{background:var(--green);color:#fff}
.tl-dot.pending{background:#fff;color:var(--text-muted);border:2px solid var(--border)}
.tl-dot.current{background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(255,107,138,0.3)}
.tl-content{flex:1}
.tl-title{font-size:14px;font-weight:700}
.tl-date{font-size:11px;color:var(--text-light)}
.tl-desc{font-size:12px;color:var(--text-light);margin-top:2px}

/* ========== Check-in Grid ========== */
.checkin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.checkin-box{
  border-radius:var(--radius-sm);padding:16px 12px;text-align:center;
  cursor:pointer;transition:all 0.25s;border:2px dashed rgba(0,0,0,0.08);
  background:#fff;
}
.checkin-box:hover{transform:translateY(-2px);border-color:var(--pink);box-shadow:0 4px 16px rgba(255,107,138,0.1)}
.checkin-box.done{
  background:var(--green-light);border-color:var(--green);border-style:solid;
}
.checkin-box .cb-icon{font-size:28px;margin-bottom:6px}
.checkin-box .cb-name{font-size:13px;font-weight:700}
.checkin-box .cb-desc{font-size:11px;color:var(--text-light);margin-top:3px}
.checkin-box .cb-check{font-size:11px;color:var(--green);margin-top:4px;font-weight:700}

/* ========== Video Card ========== */
.video-block{
  border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);background:#fff;margin-bottom:12px;
}
.video-block .vb-header{
  padding:14px 18px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg, #FFF0F3, #FFE8EC);
}
.video-block .vb-header.en{background:linear-gradient(135deg, #EEF5FC, #E3EEF9)}
.video-block .vb-header .vb-icon{font-size:26px}
.video-block .vb-header .vb-info{flex:1}
.video-block .vb-header .vb-title{font-size:14px;font-weight:800}
.video-block .vb-header .vb-desc{font-size:11px;color:var(--text-light)}
.video-block .vb-wrapper{position:relative;width:100%;padding-top:56.25%}
.video-block .vb-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.video-block .vb-footer{padding:8px 18px;font-size:11px;color:var(--text-muted)}

.daily-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:768px){.daily-grid{grid-template-columns:1fr}}

/* ========== Daily Phrase ========== */
.phrase-block{
  background:linear-gradient(135deg, #EEF5FC 0%, #E8F0FA 100%);
  border:2px solid rgba(91,155,213,0.2);border-radius:var(--radius);
  padding:20px;margin-bottom:12px;text-align:center;
}
.phrase-block .pb-label{font-size:11px;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.phrase-block .pb-eng{font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px}
.phrase-block .pb-cn{font-size:14px;color:var(--text-light)}
.phrase-block .pb-ctx{font-size:11px;color:var(--text-muted);margin-top:6px}
.phrase-block .pb-actions{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ========== Speaker Button ========== */
.speak-btn{
  display:inline-flex;align-items:center;gap:5px;padding:7px 15px;
  border:2px solid var(--blue);border-radius:20px;background:#fff;
  color:var(--blue);font-size:12px;font-weight:700;cursor:pointer;
  transition:all 0.2s;font-family:inherit;
}
.speak-btn:hover{background:var(--blue-light)}
.speak-btn.active{background:var(--blue);color:#fff;animation:pulse 0.6s infinite}

/* ========== Lyrics ========== */
.lyrics-box{
  background:#fff;border-radius:var(--radius-sm);padding:14px;
  max-height:240px;overflow-y:auto;margin-top:10px;
}
.lyrics-box .lyric-line{padding:7px 0;font-size:13px;border-bottom:1px dashed rgba(0,0,0,0.06);display:flex;gap:10px}
.lyrics-box .lyric-line:last-child{border:none}
.lyrics-box .l-cn{flex:1;font-weight:600;color:var(--text)}
.lyrics-box .l-en{flex:1;color:var(--text-light);font-style:italic}

/* ========== Audio Player ========== */
.audio-bar{
  background:linear-gradient(135deg, #FFFBE6, #FFF5D0);
  border:2px solid rgba(255,210,63,0.2);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:10px;
}
.audio-bar .ab-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.audio-bar .ab-icon{font-size:28px}
.audio-bar .ab-title{font-size:14px;font-weight:800}
.audio-bar .ab-desc{font-size:11px;color:var(--text-light)}
.audio-bar .ab-controls{display:flex;align-items:center;gap:8px}
.audio-bar .ab-play{
  width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  background:var(--orange);color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.audio-bar .ab-play:hover{transform:scale(1.05);background:var(--orange-dark)}

/* ========== Progress Bar ========== */
.progress-wrap{height:10px;background:rgba(0,0,0,0.06);border-radius:5px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:5px;transition:width 0.4s ease}
.progress-fill.pink{background:var(--pink)}
.progress-fill.green{background:var(--green)}
.progress-fill.orange{background:var(--orange)}

/* ========== Modal ========== */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;
  align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:var(--radius);width:90%;max-width:480px;
  max-height:85vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,0.2);
}
.modal-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:#fff;z-index:1;
}
.modal-header h3{font-size:16px;font-weight:800}
.modal-body{padding:18px 20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.modal-close{
  width:34px;height:34px;border-radius:50%;border:none;background:var(--pink-light);
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;
}
.modal-close:hover{background:var(--pink);color:#fff}

/* ========== Forms ========== */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text)}
.form-input,.form-select,.form-textarea{
  width:100%;padding:10px 14px;border:2px solid var(--border);
  border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);
  background:#fff;transition:border-color 0.2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--pink)}
.form-input[type="date"],.form-input[type="datetime-local"]{padding:10px 14px;min-height:42px}
.form-textarea{resize:vertical;min-height:60px}
.form-hint{font-size:11px;color:var(--text-muted);margin-top:4px}

/* ========== Tags ========== */
.tag{
  display:inline-block;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;
}
.tag-pink{background:var(--pink-light);color:var(--pink-dark)}
.tag-orange{background:var(--orange-light);color:var(--orange-dark)}
.tag-blue{background:var(--blue-light);color:var(--blue-dark)}
.tag-green{background:var(--green-light);color:var(--green-dark)}
.tag-purple{background:var(--purple-light);color:var(--purple-dark)}
.tag-gray{background:rgba(0,0,0,0.04);color:var(--text-light)}

/* ========== Date Badge ========== */
.date-badge{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  background:var(--yellow);border-radius:20px;font-size:11px;
  color:#7A5D00;font-weight:700;
}

/* ========== Empty State ========== */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state .es-text{font-size:14px}

/* ========== Toast ========== */
.toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:12px 18px;border-radius:10px;color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);animation:slideIn 0.3s ease;max-width:320px;
}
.toast-success{background:var(--green)}
.toast-error{background:var(--coral)}
.toast-info{background:var(--blue)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ========== Confirm ========== */
.confirm-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:150;
  align-items:center;justify-content:center;
}
.confirm-overlay.show{display:flex}
.confirm-box{
  background:#fff;border-radius:var(--radius);width:90%;max-width:360px;
  padding:24px;text-align:center;
}
.confirm-box h3{margin-bottom:8px}
.confirm-box p{font-size:13px;color:var(--text-light);margin-bottom:16px}

/* ========== Animations ========== */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.anim-fade{animation:fadeIn 0.35s ease}

/* ========== Responsive ========== */
@media(max-width:768px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;width:260px;min-width:260px;z-index:50}
  .sidebar.open{transform:translateX(260px)}
  .main-content{padding:12px;padding-bottom:80px}
  .main-header{padding:0 12px}
  .stat-blocks{flex-direction:column}
  .stat-block{min-width:100%}
  .checkin-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .bottom-nav{display:flex!important}
  .mobile-btn{display:block!important}
}
@media(min-width:769px){
  .mobile-btn{display:none!important}
  .bottom-nav{display:none!important}
}

/* Mobile Bottom Navigation */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:#fff;border-top:1px solid var(--border);
  padding:6px 0 env(safe-area-inset-bottom,0);
  box-shadow:0 -2px 16px rgba(0,0,0,0.06);
}
.bottom-nav .bn-items{display:flex;width:100%}
.bottom-nav .bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;cursor:pointer;font-size:10px;font-weight:600;
  color:var(--text-light);transition:color 0.2s;
}
.bottom-nav .bn-item.active{color:var(--pink)}
.bottom-nav .bn-item .bn-icon{font-size:20px}

/* Mobile sidebar overlay */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:45;
}
@media(max-width:768px){.sidebar-overlay.show{display:block}}

.mobile-btn{
  background:none;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:4px;

/* Family avatars row */
.family-row{display:flex;gap:6px;flex-wrap:wrap}
.family-chip{
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;
  color:#fff;cursor:pointer;transition:all 0.2s;
}
.family-chip:hover{transform:scale(1.05)}

/* Photo Avatar */
.photo-avatar{
  width:48px;height:48px;border-radius:50%;object-fit:cover;
  border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.1);
  cursor:pointer;flex-shrink:0;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;background:var(--pink-light);
}
.photo-avatar:hover{transform:scale(1.1)}
.photo-avatar.lg{width:72px;height:72px;font-size:36px}
.photo-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}

  text-align:center;margin-top:2px;

/* Chart SVG container */
.chart-wrap{overflow-x:auto;margin-top:10px}
.chart-wrap svg{max-width:100%;height:auto}

<script>
// ===================== SYNC ENGINE =====================
const SYNC_URL = window.location.origin + '/api';
let SYNC_ENABLED = true;
let SYNC_VERSION = 0;
let SYNC_TIMER = null;
let POLL_INTERVAL = null;
let lastSyncFromServer = null; // track last sync for notification

async function syncCheck() {
  if (!SYNC_ENABLED) return;
  try {
    const resp = await fetch(SYNC_URL + '/version', { signal: AbortSignal.timeout(3000) });
    if (!resp.ok) throw new Error('Server error');
    const { version } = await resp.json();
    if (version > SYNC_VERSION) {
      await syncPull(true);
    }
    updateSyncUI(true);
  } catch (e) {
    updateSyncUI(false);
  }
}

async function syncPull(silent = false) {
  try {
    const resp = await fetch(SYNC_URL + '/data');
    if (!resp.ok) return;
    const { data, version } = await resp.json();
    if (version > SYNC_VERSION) {
      // Merge server data (server is source of truth for shared state)
      const local = getLocalData();
      const merged = { ...data,
        baby: { ...local.baby, ...data.baby },
        settings: { ...local.settings, ...data.settings }
      };
      localStorage.setItem('maibao_data', JSON.stringify(merged));
      SYNC_VERSION = version;
      refreshLocalData();

      // CRITICAL FIX: Re-render the page so user sees the new data
      if (!silent) {
        renderPage(currentPage);
        updateSel();
        updateBabyDisp();
      } else {
        // Silent update: refresh data, gentle re-render after delay
        setTimeout(() => {
          if (document.hidden) return; // skip if tab in background
          renderPage(currentPage);
        }, 300);
      }

      // Show notification only if data came from someone else recently
      const now = Date.now();
      if (lastSyncFromServer && (now - lastSyncFromServer) > 3000) {
        lastSyncFromServer = now;
      }
    }
  } catch (e) { /* silently fail */ }
}

async function syncPush(immediate = false) {
  if (!SYNC_ENABLED) return;
  const data = getLocalData();
  data._version = SYNC_VERSION;
  try {
    const resp = await fetch(SYNC_URL + '/sync', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
      signal: AbortSignal.timeout(15000)
    });
    if (resp.ok) {
      const result = await resp.json();
      SYNC_VERSION = result.version;
      updateSyncUI(true);
    }
  } catch (e) {
    updateSyncUI(false);
  }
}

function syncAfterChange() {
  clearTimeout(SYNC_TIMER);
  // Push immediately (100ms debounce instead of 500ms for faster sync)
  SYNC_TIMER = setTimeout(() => syncPush(true), 100);
}

function updateSyncUI(online) {
  const el = document.getElementById('sync-indicator');
  const txt = document.getElementById('sync-text');
  if (online) {
    el.className = 'sync-indicator';
    txt.textContent = '已同步';
  } else {
    el.className = 'sync-indicator offline';
    txt.textContent = '离线';
  }
}

// SSE for real-time updates
let sseSource = null;
function setupSSE() {
  try {
    if (sseSource) sseSource.close();
    sseSource = new EventSource(SYNC_URL + '/stream');
    sseSource.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'update' && msg.version > SYNC_VERSION) {
          // Real-time update from another family member - re-render immediately
          syncPull(false);
        }
      } catch (e) {}
    };
    sseSource.onerror = () => {
      // SSE failed, fall back to fast polling
      sseSource.close();
      sseSource = null;
      startPolling();
    };
  } catch (e) {
    startPolling();
  }
}

function startPolling() {
  if (POLL_INTERVAL) clearInterval(POLL_INTERVAL);
  // Poll every 3 seconds for near-real-time updates
  POLL_INTERVAL = setInterval(syncCheck, 3000);
}

// Test connection on init
async function testConnection() {
  try {
    const resp = await fetch(SYNC_URL + '/health-check', { signal: AbortSignal.timeout(2000) });
    if (resp.ok) {
      SYNC_ENABLED = true;
      return true;
    }
  } catch (e) {}
  SYNC_ENABLED = false;
  updateSyncUI(false);
  return false;
}

// ===================== DATA LAYER =====================
function getLocalData() {
  try { return JSON.parse(localStorage.getItem('maibao_data')) || getDefaultData(); }
  catch { return getDefaultData(); }
}

function getDefaultData() {
  return {
    _version: 0,
    baby: { name: '麦宝', birthDate: '', gender: '', weight: '', height: '', currentMember: '' },
    members: [],
    feedingRecords: [], supplementRecords: [], poopRecords: [],
    growthRecords: [], milestones: [],
    vaccineRecords: [], healthChecks: [],
    educationRecords: [],
    settings: { supplementAlternate: true }
  };
}

let DATA = getLocalData();
function refreshLocalData() { DATA = getLocalData(); }
function saveLocal(immediate) {
  localStorage.setItem('maibao_data', JSON.stringify(DATA));
  syncAfterChange();
}

// ===================== UTILITIES =====================
function formatDate(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function now() {
  const d=new Date();
  return formatDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function nowDT() {
  // Returns proper datetime-local format: YYYY-MM-DDTHH:MM
  const d=new Date();
  return formatDate(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function today() { return formatDate(new Date()); }
function getAgeMonths(birthDate) {
  if(!birthDate) return 0;
  const b=new Date(birthDate);const n=new Date();
  return (n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());
}
function getMonthLabel(m) { return m<12?m+'个月':Math.floor(m/12)+'岁'+(m%12>0?m%12+'个月':''); }
function getAgeDetail(birthDate) {
  if(!birthDate) return {months:0,days:0};
  const b=new Date(birthDate);const n=new Date();
  // Calculate exact age
  let years=n.getFullYear()-b.getFullYear();
  let months=n.getMonth()-b.getMonth();
  let days=n.getDate()-b.getDate();
  if(days<0){months--;const prevMonth=new Date(n.getFullYear(),n.getMonth(),0);days+=prevMonth.getDate();}
  if(months<0){years--;months+=12;}
  const totalMonths=years*12+months;
  return {months:totalMonths,days};
}
function getAgeText(birthDate) {
  const {months,days}=getAgeDetail(birthDate);
  if(months<1) return days+'天';
  if(months<12) return months+'个月'+days+'天';
  const y=Math.floor(months/12),m=months%12;
  return m>0?y+'岁'+m+'个月':y+'岁';
}
function getDailySeed(str) { let h=0;const s=str+today();for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h); }
function seededPick(arr,seed) { return arr[Math.floor((Math.sin(seed)*10000-Math.floor(Math.sin(seed)*10000))*arr.length)]; }
function toast(msg,type='success') {
  const c=document.getElementById('toast-container');
  const el=document.createElement('div');el.className='toast toast-'+type;el.textContent=msg;c.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300)},2500);
}
function showModal(title,body,footer) {
  document.getElementById('modal').innerHTML=`
    <div class="modal-header"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}</div>
    ${footer?'<div class="modal-footer">'+footer+'</div>':''}`;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }
function showConfirm(title,msg,fn) {
  document.getElementById('confirm-box').innerHTML=`
    <h3>${title}</h3><p>${msg}</p>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn btn-outline btn-sm" onclick="closeConfirm()">取消</button>
      <button class="btn btn-primary btn-sm" id="cfm-btn">确认</button></div>`;
  document.getElementById('confirm-overlay').classList.add('show');
  document.getElementById('cfm-btn').onclick=()=>{closeConfirm();fn();};
}
function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('show'); }

let currentPage = 'home';

function navigateTo(page) {
  currentPage = page;
  // Update sidebar nav
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  // Update bottom nav
  document.querySelectorAll('.bn-item').forEach(el=>el.classList.remove('active'));
  document.querySelector(`.bn-item[data-page="${page}"]`)?.classList.add('active');
  const titles={home:'首页',feeding:'喂养记录',growth:'成长记录',vaccine:'疫苗接种',education:'早教中心',bilingual:'双语学习',family:'家庭成员'};
  document.getElementById('page-title').textContent = titles[page]||'';
  // Auto-close sidebar on mobile
  if(window.innerWidth<=768){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
  }
  renderPage(page);
}
function toggleSidebar() {
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebar-overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}

function renderPage(page) {
  const c = document.getElementById('main-content');
  switch(page) {
    case 'home': c.innerHTML = renderHome(); break;
    case 'feeding': c.innerHTML = renderFeeding(); break;
    case 'growth': c.innerHTML = renderGrowth(); break;
    case 'vaccine': c.innerHTML = renderVaccine(); break;
    case 'education': c.innerHTML = renderEducation(); break;
    case 'bilingual': c.innerHTML = renderBilingual(); break;
    case 'family': c.innerHTML = renderFamily(); break;
  }
  attachPageEvents(page);
}

    document.querySelectorAll('#feeding-tabs .tab').forEach(tab=>{

function getTodaySupplement() {
  const t = today();
  const takenToday = DATA.supplementRecords.filter(r=>r.date.startsWith(t));
  const takenTypes = takenToday.map(r=>r.type);
  const adD3 = DATA.supplementRecords.filter(r=>r.type==='AD'||r.type==='D3').sort((a,b)=>a.date.localeCompare(b.date));
  let todayShould = 'AD';
  if(adD3.length>0) todayShould = adD3[adD3.length-1].type==='AD'?'D3':'AD';
  if(takenTypes.includes(todayShould)) return null;
  const name = todayShould==='AD'?'维生素AD':'维生素D3';
  const note = todayShould==='AD'?'今天该吃AD，明天换D3' : '今天该吃D3，明天换AD';
  return {type:todayShould,name,note};
}

function markSupp(type) {

function renderFeedHistory(type) {
  const recs = DATA.feedingRecords.filter(r=>{if(type==='milk')return r.type==='breastmilk'||r.type==='formula';return r.type===type;}).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);

  const grps={};recs.forEach(r=>{const d=r.date.split(' ')[0];if(!grps[d])grps[d]=[];grps[d].push(r);});
  return Object.entries(grps).map(([d,rs])=>`<div style="margin-bottom:8px"><div style="font-size:12px;font-weight:700;color:var(--text-light);margin-bottom:4px">📅 ${d}</div>

}

function showWeightHistory() {
  const recs = DATA.growthRecords.filter(r=>r.weight).sort((a,b)=>b.date.localeCompare(a.date));

  const html = `<table style="width:100%;border-collapse:collapse">
    <tr style="border-bottom:2px solid var(--pink-light)"><th style="padding:8px;text-align:left">日期</th><th style="padding:8px;text-align:right">体重</th><th style="padding:8px;text-align:right">变化</th></tr>
    ${recs.map((r,i)=>{
      const prev = i<recs.length-1?parseFloat(recs[i+1].weight):0;
      const curr = parseFloat(r.weight);
      const diff = prev>0?(curr-prev).toFixed(1):'-';
      const color = diff>0?'var(--pink)':diff<0?'var(--green)':'var(--text-light)';
      const arrow = diff>0?'↑':diff<0?'↓':'';
      return `<tr style="border-bottom:1px solid rgba(0,0,0,0.04)"><td style="padding:8px">${r.date.split(' ')[0]}</td><td style="padding:8px;text-align:right;font-weight:700">${r.weight} kg</td><td style="padding:8px;text-align:right;color:${color}">${arrow} ${diff} kg</td></tr>`;
    }).join('')}

  showModal('⚖️ 体重历史记录',html);
}

function renderGrowthChart(recs,wData,hData,ageMonths) {
  const W=600,H=280,pl=50,pr=30,pt=20,pb=40,cw=W-pl-pr,ch=H-pt-pb;
  const wRecs=recs.filter(r=>!isNaN(parseFloat(r.weight))).map(r=>({x:getAgeM(r),y:parseFloat(r.weight),label:r.weight+'kg',d:r.date.split(' ')[0]}));
  const hRecs=recs.filter(r=>!isNaN(parseFloat(r.height))).map(r=>({x:getAgeM(r),y:parseFloat(r.height),label:r.height+'cm',d:r.date.split(' ')[0]}));
  const whoK=Object.keys(wData).map(Number).sort((a,b)=>a-b);
  const w=wRecs.map(r=>r.y);const h=hRecs.map(r=>r.y);whoK.forEach(k=>{w.push(wData[k][0]);w.push(wData[k][2]);});
  const wMin=Math.floor(Math.min(...w))-0.5,wMax=Math.ceil(Math.max(...w))+0.5;
  const xMax=Math.max(ageMonths+2,Math.max(...recs.map(r=>getAgeM(r)))+2,12);
  function x(v){return pl+(v/(xMax))*cw;}function y(v,min,max){return pt+ch-((v-min)/(max-min))*ch;}
  const pts50=whoK.map(k=>({x:k,y:wData[k][1]})),pts3=whoK.map(k=>({x:k,y:wData[k][0]})),pts97=whoK.map(k=>({x:k,y:wData[k][2]}));
  function pline(pts,min,max,c,d){return pts.length<2?'':`<polyline points="${pts.map(p=>x(p.x)+','+y(p.y,min,max)).join(' ')}" fill="none" stroke="${c}" stroke-width="${d?1.5:2}" stroke-dasharray="${d||''}"/>`;}
  let grid='';for(let i=0;i<=5;i++){const v=wMin+(wMax-wMin)/5*i;const yy=y(v,wMin,wMax);grid+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="#eee" stroke-width="0.5"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="9" fill="#999">${v.toFixed(1)}</text>`;}
  return `
    <div class="card card-white" style="margin-bottom:16px"><div class="card-header"><div class="card-title"><span class="icon">📈</span>体重曲线 (kg)</div></div>
      <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px">
        ${grid}${pline(pts3,wMin,wMax,'#ddd','4,4')}${pline(pts50,wMin,wMax,'#ccc','4,4')}${pline(pts97,wMin,wMax,'#ddd','4,4')}
        ${pline(wRecs,wMin,wMax,'var(--pink)')}
        ${wRecs.map(p=>`<circle cx="${x(p.x)}" cy="${y(p.y,wMin,wMax)}" r="5" fill="var(--pink)" stroke="#fff" stroke-width="2"/><text x="${x(p.x)}" y="${y(p.y,wMin,wMax)-10}" text-anchor="middle" font-size="9" fill="var(--pink-dark)" font-weight="700">${p.label}</text>`).join('')}
        ${[0,3,6,9,12,18,24].filter(m=>m<=xMax).map(m=>`<text x="${x(m)}" y="${H-10}" text-anchor="middle" font-size="9" fill="#999">${m}月</text>`).join('')}
        <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#ddd"/></svg></div></div>`;
}

function getAgeM(r) { 
  if(!DATA.baby.birthDate)return 0;
  const b=new Date(DATA.baby.birthDate);
  const d=new Date(r.date);
  let months=(d.getFullYear()-b.getFullYear())*12+(d.getMonth()-b.getMonth());
  // Fix: if record day < birth day, subtract 1 month (not yet a full month)
  if(d.getDate()<b.getDate()) months--;
  return Math.max(0,months);
}

// Photo upload helpers
// Photo upload with compression
function compressImage(file, maxSize, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
      else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function uploadMemberPhoto(name) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    compressImage(file, 300, (compressed) => {
      const member = DATA.members.find(m => m.name === name);
      if (member) {
        member.photo = compressed;
        saveLocal(true);
        toast('✅ 头像已更新，正在同步到其他设备...');
        renderPage('family');
      }
    });
  };
  input.click();
}

function uploadBabyPhoto() { document.getElementById('baby-photo-input').click(); }

function handleBabyPhoto(event) {
  const file = event.target.files[0]; if (!file) return;
  compressImage(file, 400, (compressed) => {
    DATA.baby.photo = compressed;
    saveLocal(true);
    toast('✅ 宝宝头像已更新，正在同步到其他设备...');

function handleGrowthPhoto(event) {
  const file = event.target.files[0]; if (!file) return;

function saveMember(){const n=document.getElementById('mn2').value;if(!n){toast('请输入称呼','error');return;}if(!DATA.members)DATA.members=[];if(DATA.members.find(m=>m.name===n)){toast('已存在','error');return;}DATA.members.push({name:n,role:document.getElementById('mr2').value,emoji:document.getElementById('me2').value||'👤'});if(!DATA.baby.currentMember)DATA.baby.currentMember=n;localStorage.setItem('maibao_my_name',n);saveLocal();closeModal();updateSel();toast('已添加，当前账号：'+n);renderPage('family');}
function delMember(n){showConfirm('删除',`确认删除"${n}"？`,()=>{DATA.members=DATA.members.filter(m=>m.name!==n);if(DATA.baby.currentMember===n)DATA.baby.currentMember=DATA.members[0]?.name||'';saveLocal();updateSel();toast('已删除');renderPage('family');});}
function switchFam(n){

  DATA.baby.currentMember=n;

function getMyName(){
  // Each device remembers its own user independently
  const local = localStorage.getItem('maibao_my_name');
  if(local) return local;
  // Fallback: use synced current member, or first member
  if(DATA.baby.currentMember && DATA.members.find(m=>m.name===DATA.baby.currentMember))
    return DATA.baby.currentMember;
  if(DATA.members.length>0) return DATA.members[0].name;
  return '';

function updateBabyDisp(){const el=document.getElementById('sidebar-baby-info');if(el){if(DATA.baby.birthDate)el.textContent=`${DATA.baby.name||'麦宝'} · ${getAgeText(DATA.baby.birthDate)} ${DATA.baby.gender==='boy'?'👦':'👧'}`;else el.textContent='请设置宝宝信息';}}

// ===================== INIT =====================
async function init() {
  refreshLocalData();
  document.getElementById('current-date').textContent = today();
  updateHeaderAge();

  // Test server connection
  const online = await testConnection();
  if (online) {
    await syncPull(true); // initial data pull from server (silent)
    setupSSE();
  } else {
    // Offline mode - still usable with localStorage
    updateSyncUI(false);
  }
  // Fallback polling (safeguard against SSE failure)
  startPolling();

  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click',()=>navigateTo(item.dataset.page));
  });

  document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
  document.getElementById('confirm-overlay').addEventListener('click',function(e){if(e.target===this)closeConfirm();});

  // Ensure data structures
  if(!DATA.feedingRecords) DATA.feedingRecords=[];
  if(!DATA.supplementRecords) DATA.supplementRecords=[];
  if(!DATA.poopRecords) DATA.poopRecords=[];
  if(!DATA.growthRecords) DATA.growthRecords=[];
  if(!DATA.milestones) DATA.milestones=[];
  if(!DATA.members) DATA.members=[];
  if(!DATA.educationRecords) DATA.educationRecords=[];
  saveLocal(true);

  // Load per-device user preference (each phone remembers its own user)
  const myName = getMyName();
  if(myName) DATA.baby.currentMember = myName;

  updateSel();updateBabyDisp();
  navigateTo('home');
}

document.addEventListener('DOMContentLoaded', init);

// Periodic refresh
setInterval(()=>{refreshLocalData();document.getElementById('current-date').textContent=today();updateHeaderAge();},30000);
</script>

<script>

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      console.log('SW registered');
    }).catch(() => {});

// PWA Install
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install banner after 3 seconds
  setTimeout(() => {
    document.getElementById('install-banner').style.display = 'flex';
  }, 3000);
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('install-banner').style.display = 'none';
    });
  }
}

// Hide banner if already installed
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').style.display = 'none';
});

// Push notification subscription (optional)
async function subscribePush() {
  if ('Notification' in window && 'serviceWorker' in navigator) {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      const reg = await navigator.serviceWorker.ready;
      // VAPID keys would be needed for actual push, skip for now
      console.log('Push notifications enabled');
    }
  }
}
